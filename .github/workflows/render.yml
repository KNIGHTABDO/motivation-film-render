name: Render HyperFrames Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct download URL for stitched_video.mp4'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Stitched Video Asset
        run: |
          mkdir -p media
          if [ -n "${{ github.event.inputs.video_url }}" ]; then
            curl -L -o media/stitched_video.mp4 "${{ github.event.inputs.video_url }}"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install FFmpeg & Chrome Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2 fonts-noto-core fonts-dejavu-core

      - name: Install HyperFrames CLI
        run: npm install -g @heygen/hyperframes-cli

      - name: Quality Check
        run: hyperframes check .

      - name: Render Video 1080p
        run: |
          mkdir -p output
          hyperframes render -o output/Crucible_of_Dawn_1080p.mp4
          ls -lh output/

      - name: Upload Master Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: motivation-master-1080p
          path: output/

      - name: Create Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" output/Crucible_of_Dawn_1080p.mp4 \
            --title "La Boîte à Bac - The Crucible of Dawn 1080p ($TAG)" \
            --notes "Cinematic motivational film rendered in the cloud."
