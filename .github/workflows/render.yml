name: Render HyperFrames Video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Stitched Video Source
        run: |
          mkdir -p media
          curl -L -o media/stitched_video.mp4 "https://github.com/KNIGHTABDO/motivation-film-render/releases/download/source-v1/stitched_raw.mp4"
          ls -lh media/stitched_video.mp4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 fonts-noto-core fonts-dejavu-core libasound2t64 || sudo apt-get install -y -qq ffmpeg libnss3 libgbm1

      - name: Install HyperFrames CLI
        run: npm install -g @heygen/hyperframes-cli

      - name: Quality Check
        run: hyperframes check .

      - name: Render Full 1080p Video
        run: |
          mkdir -p output
          hyperframes render -o output/The_Crucible_of_Dawn_1080p.mp4
          ls -lh output/

      - name: Upload Master Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: motivation-master-1080p
          path: output/The_Crucible_of_Dawn_1080p.mp4

      - name: Publish Final Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="final-1080p"
          gh release create "$TAG" output/The_Crucible_of_Dawn_1080p.mp4 \
            --title "The Crucible of Dawn - Master 1080p" \
            --notes "Broadcast-quality motivational film with full kinetic typography, pure Cairo Arabic subtitles, and master audio."
